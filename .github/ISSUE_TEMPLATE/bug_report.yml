name: Bug Report
description: Report something that isn't working correctly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Dashboards.Database (schema/views/stored procedures)
        - Dashboards.Database.ETL (SSIS packages)
        - Power BI report (EQ-12 / EQ-18 / EQ-19)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Deploy/open '...'
        2. Run/click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages, logs, or screenshots
      description: Paste any SSIS execution output, SQL error messages, or Power BI error details.

  - type: input
    id: sql-version
    attributes:
      label: SQL Server version
      placeholder: e.g. SQL Server 2022

  - type: input
    id: tooling-version
    attributes:
      label: Visual Studio / SSDT / Power BI Desktop version
      placeholder: e.g. Visual Studio 2022 17.9, Power BI Desktop June 2026

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant.
